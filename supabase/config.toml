# Supabase CLI settings for Nhà Mình. There is no local stack: the only database is the
# production project (dev/guides/backend.md). The CLI uses this folder for `link`,
# `pnpm db:new` and `pnpm db:push` (migrations/ → production).
project_id = "nha-minh"

[auth]
# The family account is made by hand in the dashboard; the app has no sign-up (spec mvp.md §2.0).
enable_signup = false
minimum_password_length = 8
